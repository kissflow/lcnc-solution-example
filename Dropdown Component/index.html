<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dropdown</title>
    <style>
        .dropdown-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        select {
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 8px; /* Added padding to create space inside the dropdown */
        }
    </style>
</head>
<body>
    <div class="dropdown-container">
        <select id="dynamicDropdown">
            <option value="all">All</option>
        </select>
    </div>

    <script src="https://unpkg.com/@kissflow/lowcode-client-sdk@latest/dist/kfsdk.umd.js"></script>
    <script>
        let kf;
        window.onload = async function () {
            try {
                kf = await window.kf.initialize();
                populateDropdown();
            } catch (error) {
                console.error("Error initializing Kissflow SDK:", error);
            }
        };

        async function populateDropdown() {
            try {
                let dropdown = document.getElementById("dynamicDropdown");
                let dropdownValues = await kf.app.getVariable("DropdownValues"); // Get comma-separated values
                
                dropdown.innerHTML = "<option value='all'>All</option>"; // Reset options
                
                if (dropdownValues) {
                    let valuesArray = dropdownValues.split(",").map(item => item.trim()); // Split and trim values
                    
                    valuesArray.forEach(value => {
                        let option = document.createElement("option");
                        option.value = value;
                        option.textContent = value;
                        dropdown.appendChild(option);
                    });
                }
            } catch (error) {
                console.error("Error fetching dropdown values:", error);
            }
        }

        document.getElementById("dynamicDropdown").addEventListener("change", async function () {
            try {
                let selectedValue = this.value;
                if (selectedValue === "all") {
                    await kf.app.setVariable("SelectedValue", ""); // Reset selected values
                    this.value = "all"; // Ensure dropdown shows 'All'
                } else {
                    await kf.app.setVariable("SelectedValue", selectedValue); // Store selected value
                }
            } catch (error) {
                console.error("Error setting selected value:", error);
            }
        });
    </script>
</body>
</html>
